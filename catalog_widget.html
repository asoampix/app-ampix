<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Poupee Crochet</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #D97D64;       /* Terracota suave / Hilo de tejer */
      --primary-hover: #C56A52;
      --secondary: #81B29A;     /* Verde salvia suave */
      --bg-cream: #FDFBF7;      /* Crema de fondo */
      --card-bg: #FFFFFF;
      --text-dark: #2B2D42;     /* Antracita elegante */
      --text-light: #6C757D;
      --shadow-sm: 0 2px 8px rgba(217, 125, 100, 0.08);
      --shadow-md: 0 8px 24px rgba(217, 125, 100, 0.12);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-main: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      padding: 20px;
      overflow-x: hidden;
    }

    /* Contenedor principal */
    .catalog-container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }

    /* Encabezado e-Commerce */
    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .catalog-title h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      position: relative;
      display: inline-block;
    }
    .catalog-title h2::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 40px;
      height: 3px;
      background-color: var(--secondary);
      border-radius: 2px;
    }

    .catalog-title p {
      font-size: 0.95rem;
      color: var(--text-light);
      margin-top: 5px;
    }

    /* Buscador y Filtros */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-box {
      position: relative;
      max-width: 320px;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 2px solid #EFEAE2;
      border-radius: 12px;
      background-color: var(--card-bg);
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: var(--transition);
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 125, 100, 0.15);
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      width: 18px;
      height: 18px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none; /* Firefox */
    }

    .filter-tabs::-webkit-scrollbar {
      display: none; /* Safari/Chrome */
    }

    .filter-tab {
      background-color: var(--card-bg);
      border: 2px solid #EFEAE2;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .filter-tab.active, .filter-tab:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    /* Grid de Productos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    /* Tarjeta de Producto */
    .product-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid #F3EDE4;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .product-image-container {
      position: relative;
      width: 100%;
      padding-top: 100%; /* Relación de aspecto 1:1 */
      background-color: #F8F5F0;
      overflow: hidden;
      cursor: zoom-in;
    }

    .product-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-image-container img {
      transform: scale(1.08);
    }

    .product-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: var(--secondary);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 2;
    }

    .product-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--primary);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .product-description {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 15px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.6em;
    }

    .product-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .btn-add-to-cart {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .btn-add-to-cart:hover {
      background-color: var(--primary-hover);
      transform: scale(1.1);
    }

    .btn-add-to-cart i {
      width: 18px;
      height: 18px;
    }

    /* Carrito Flotante (Icono) */
    .cart-float-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: var(--primary);
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(217, 125, 100, 0.4);
      cursor: pointer;
      z-index: 100;
      transition: var(--transition);
    }

    .cart-float-btn:hover {
      transform: scale(1.08) translateY(-3px);
      background-color: var(--primary-hover);
    }

    .cart-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: var(--secondary);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    /* Lateral del Carrito (Drawer) */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background-color: var(--card-bg);
      box-shadow: -4px 0 30px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-drawer-header {
      padding: 20px;
      border-bottom: 1px solid #F3EDE4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-drawer-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-drawer-header h3 i {
      color: var(--primary);
    }

    .btn-close-cart {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 50%;
      transition: var(--transition);
    }

    .btn-close-cart:hover {
      background-color: #F8F5F0;
      color: var(--text-dark);
    }

    .cart-items-list {
      padding: 20px;
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cart-empty-message {
      text-align: center;
      color: var(--text-light);
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .cart-empty-message i {
      width: 48px;
      height: 48px;
      color: #EFEAE2;
    }

    /* Elemento del Carrito */
    .cart-item {
      display: flex;
      gap: 12px;
      padding-bottom: 15px;
      border-bottom: 1px solid #F8F5F0;
      align-items: center;
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #F8F5F0;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 0.9rem;
      color: var(--primary);
      font-weight: 700;
    }

    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .qty-btn {
      background-color: #F8F5F0;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .qty-btn:hover {
      background-color: #EFEAE2;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .cart-item-remove:hover {
      color: #E63946;
    }

    /* Pie del Carrito */
    .cart-drawer-footer {
      padding: 20px;
      border-top: 1px solid #F3EDE4;
      background-color: #FDFBF7;
    }

    .cart-totals {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text-dark);
    }

    .cart-totals span:last-child {
      color: var(--primary);
      font-size: 1.3rem;
    }

    .payment-notice {
      background-color: #EAF4F0;
      border-left: 3px solid var(--secondary);
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #3E6B5C;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    .payment-notice i {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .btn-checkout {
      width: 100%;
      background-color: #25D366; /* Verde WhatsApp */
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-checkout:hover {
      background-color: #128C7E;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
    }

    /* Modal de Zoom/Galería */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(43, 45, 66, 0.8);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 20px;
      max-width: 800px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      position: relative;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .btn-close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      background-color: rgba(255,255,255,0.9);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 10;
      color: var(--text-dark);
      transition: var(--transition);
    }

    .btn-close-modal:hover {
      transform: scale(1.1);
      background-color: white;
    }

    .modal-img-sec {
      flex: 1 1 350px;
      background-color: #F8F5F0;
      position: relative;
      padding-top: 80%; /* Altura proporcional */
    }

    .modal-img-sec img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-info-sec {
      flex: 1 1 350px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .modal-info-sec .product-category {
      margin-bottom: 8px;
    }

    .modal-info-sec h3 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .modal-info-sec .description {
      font-size: 0.95rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .modal-info-sec .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-info-sec .price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .modal-info-sec .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .modal-info-sec .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Fondo oscuro para cerrar drawer */
    .cart-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(43, 45, 66, 0.4);
      z-index: 999;
      display: none;
    }

    .cart-overlay.open {
      display: block;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .modal-content {
        flex-direction: column;
      }
      .modal-img-sec {
        padding-top: 70%;
      }
      .modal-info-sec {
        padding: 20px;
      }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="catalog-container">
    
    <!-- Encabezado -->
    <header class="catalog-header">
      <div class="catalog-title">
        <h2>Nuestras Creaciones</h2>
        <p>Amigurumis tejidos a mano con mucho cariño en Madrid</p>
      </div>
    </header>

    <!-- Controles -->
    <div class="controls-row">
      <!-- Buscador -->
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="searchInput" placeholder="Buscar amigurumis..." oninput="filterProducts()">
      </div>
      
      <!-- Categorías -->
      <div class="filter-tabs">
        <div class="filter-tab active" data-category="todos" onclick="setCategory('todos')">Todos</div>
        <div class="filter-tab" data-category="amigurumis" onclick="setCategory('amigurumis')">Amigurumis</div>
        <div class="filter-tab" data-category="patrones" onclick="setCategory('patrones')">Patrones PDF</div>
        <div class="filter-tab" data-category="clases" onclick="setCategory('clases')">Clases</div>
      </div>
    </div>

    <!-- Grid de Productos -->
    <div class="products-grid" id="productsGrid">
      <!-- Los productos se cargarán dinámicamente con JS -->
    </div>

  </div>

  <!-- Botón Flotante del Carrito -->
  <div class="cart-float-btn" onclick="toggleCart(true)">
    <i data-lucide="shopping-bag"></i>
    <span class="cart-badge" id="cartBadge">0</span>
  </div>

  <!-- Overlay para cerrar carrito -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart(false)"></div>

  <!-- Drawer Lateral del Carrito -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <h3><i data-lucide="shopping-bag"></i> Tu Carrito</h3>
      <button class="btn-close-cart" onclick="toggleCart(false)">
        <i data-lucide="x"></i>
      </button>
    </div>
    
    <div class="cart-items-list" id="cartItemsList">
      <!-- Elementos del carrito cargados por JS -->
    </div>
    
    <div class="cart-drawer-footer">
      <div class="cart-totals">
        <span>Total:</span>
        <span id="cartTotal">0,00 €</span>
      </div>
      
      <div class="payment-notice">
        <i data-lucide="info"></i>
        <span>Los pedidos se tramitan por WhatsApp. Aceptamos Bizum y Pago en mano al recoger en Colmenar Viejo.</span>
      </div>
      
      <button class="btn-checkout" onclick="checkoutWhatsApp()">
        <i data-lucide="message-circle"></i> Enviar Pedido por WhatsApp
      </button>
    </div>
  </div>

  <!-- Modal de Detalle/Zoom -->
  <div class="modal-overlay" id="productModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
      <button class="btn-close-modal" onclick="closeModal()">
        <i data-lucide="x"></i>
      </button>
      
      <div class="modal-img-sec" id="modalImgSec">
        <!-- Imagen -->
      </div>
      
      <div class="modal-info-sec" id="modalInfoSec">
        <!-- Detalles -->
      </div>
    </div>
  </div>

  <!-- JavaScript de la Tienda -->
  <script>
    // Datos de los productos
    const products = [
      {
        id: 1,

      {
        id: 2,

      },
      {
        id: 3,
        name: "Oso de Peluche Clásico Crochet",
        category: "amigurumis",
        categoryLabel: "Amigurumi",
        price: 18.00,
        badge: "Premium",
        image: "https://images.unsplash.com/photo-1615486511484-92e172cc4fe0?w=500&auto=format&fit=crop&q=80",
        description: "Oso de peluche clásico tejido con técnica amigurumi. Suave, resistente y muy tierno. Ojos de seguridad especiales para niños. Tamaño: 18 cm. ¡El regalo de nacimiento o cumpleaños ideal!"
      },
      {
        id: 4,
        name: "Patrón PDF: Capibara con Sombrero",
        category: "patrones",
        categoryLabel: "Patrón Digital",
        price: 4.99,
        badge: "Digital",
        image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=80",
        description: "Guía digital en PDF detallada paso a paso para tejer tu propio capibara amigurumi. Incluye instrucciones ilustradas con fotos a color, lista de materiales y abreviaturas en español. Envío inmediato por email."
      },
      {
        id: 5,
        name: "Clase Particular de Crochet (1 Hora)",
        category: "clases",
        categoryLabel: "Clases",
        price: 15.00,
        badge: "Individual",
        image: "https://images.unsplash.com/photo-1611079830811-b65d1a64c96e?w=500&auto=format&fit=crop&q=80",
        description: "Aprende a tejer desde cero o mejora tus técnicas. Clase individual de 60 minutos adaptada a tu nivel. Puede ser presencial en Colmenar Viejo (Madrid) o virtual vía Google Meet. Materiales no incluidos para la primera clase."
      }
    ];

    let cart = [];
    let currentCategory = "todos";
    const phone = "34645474609"; // Número de WhatsApp de Maria Fernanda

    // Inicializar iconos
    lucide.createIcons();

    // Cargar productos al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      // Cargar carrito de localStorage si existe
      const savedCart = localStorage.getItem("poupee_cart");
      if (savedCart) {
        cart = JSON.parse(savedCart);
        updateCartUI();
      }
      renderProducts();
    });

    // Renderizar lista de productos
    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      
      const searchVal = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = products.filter(p => {
        const matchesCategory = currentCategory === "todos" || p.category === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.description.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-light);">
            <i data-lucide="frown" style="width: 40px; height: 40px; margin-bottom: 10px; color: var(--primary);"></i>
            <p>No se encontraron productos en esta categoría.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ""}
          <div class="product-image-container" onclick="openProductModal(${p.id})">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="product-info">
            <span class="product-category">${p.categoryLabel}</span>
            <h4 class="product-name" onclick="openProductModal(${p.id})" style="cursor:pointer;">${p.name}</h4>
            <p class="product-description">${p.description}</p>
            <div class="product-meta">
              <span class="product-price">${p.price.toFixed(2).replace('.', ',')} €</span>
              <button class="btn-add-to-cart" onclick="addToCart(${p.id})" title="Añadir al carrito">
                <i data-lucide="plus"></i>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      lucide.createIcons();
    }

    // Filtrar por categorías
    function setCategory(category) {
      currentCategory = category;
      document.querySelectorAll(".filter-tab").forEach(tab => {
        tab.classList.remove("active");
        if (tab.getAttribute("data-category") === category) {
          tab.classList.add("active");
        }
      });
      renderProducts();
    }

    // Buscador interactivo
    function filterProducts() {
      renderProducts();
    }

    // Funciones del Carrito
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      saveAndRefreshCart();
      // Animación de feedback en el botón flotante
      const floatBtn = document.querySelector(".cart-float-btn");
      floatBtn.style.transform = "scale(1.2)";
      setTimeout(() => floatBtn.style.transform = "scale(1)", 200);
      
      // Abrir el carrito automáticamente para que el cliente vea que se añadió
      toggleCart(true);
    }

    function changeQuantity(productId, change) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      item.quantity += change;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== productId);
      }

      saveAndRefreshCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(i => i.id !== productId);
      saveAndRefreshCart();
    }

    function saveAndRefreshCart() {
      localStorage.setItem("poupee_cart", JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById("cartBadge");
      const list = document.getElementById("cartItemsList");
      const totalSpan = document.getElementById("cartTotal");

      // Calcular cantidad de productos
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      badge.textContent = totalQty;

      // Calcular precio total
      const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      totalSpan.textContent = `${totalCost.toFixed(2).replace('.', ',')} €`;

      list.innerHTML = "";

      if (cart.length === 0) {
        list.innerHTML = `
          <div class="cart-empty-message">
            <i data-lucide="shopping-bag"></i>
            <p>Tu carrito está vacío</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      cart.forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = "cart-item";
        itemEl.innerHTML = `
          <img src="${item.image}" alt="${item.name}" class="cart-item-img">
          <div class="cart-item-info">
            <h5 class="cart-item-name">${item.name}</h5>
            <div class="cart-item-price">${(item.price * item.quantity).toFixed(2).replace('.', ',')} €</div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
              <span>${item.quantity}</span>
              <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
            </div>
          </div>
          <button class="cart-item-remove" onclick="removeFromCart(${item.id})">
            <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
          </button>
        `;
        list.appendChild(itemEl);
      });

      lucide.createIcons();
    }

    function toggleCart(isOpen) {
      const drawer = document.getElementById("cartDrawer");
      const overlay = document.getElementById("cartOverlay");
      if (isOpen) {
        drawer.classList.add("open");
        overlay.classList.add("open");
      } else {
        drawer.classList.remove("open");
        overlay.classList.remove("open");
      }
    }

    // Modal de Detalle (Lightbox)
    function openProductModal(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      const imgSec = document.getElementById("modalImgSec");
      const infoSec = document.getElementById("modalInfoSec");

      imgSec.innerHTML = `<img src="${product.image}" alt="${product.name}">`;
      infoSec.innerHTML = `
        <span class="product-category">${product.categoryLabel}</span>
        <h3>${product.name}</h3>
        <p class="description">${product.description}</p>
        <div class="price-row">
          <span class="price">${product.price.toFixed(2).replace('.', ',')} €</span>
          <button class="btn-primary" onclick="addToCart(${product.id}); closeModal();">
            <i data-lucide="shopping-cart" style="width:18px;height:18px;"></i>
            Añadir al Carrito
          </button>
        </div>
      `;

      document.getElementById("productModal").classList.add("open");
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById("productModal").classList.remove("open");
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === "productModal") {
        closeModal();
      }
    }

    // Checkout por WhatsApp
    function checkoutWhatsApp() {
      if (cart.length === 0) {
        alert("El carrito está vacío.");
        return;
      }

      let orderText = "¡Hola Maria Fernanda! 🧶 Me gustaría hacer el siguiente pedido de *Poupee Crochet*:\n\n";
      
      cart.forEach(item => {
        orderText += `• *${item.quantity}x* ${item.name} (${(item.price * item.quantity).toFixed(2).replace('.', ',')} €)\n`;
      });

      const totalCost = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      orderText += `\n*Total del Pedido:* ${totalCost.toFixed(2).replace('.', ',')} €\n`;
      orderText += `*Método de Pago:* Bizum o Efectivo 💳\n\n`;
      orderText += `*Mi Nombre:* [Escribe tu nombre aquí]\n`;
      orderText += `*Notas/Dirección:* [Opcional - ej: Envío o recogida en Colmenar Viejo]`;

      const encodedText = encodeURIComponent(orderText);
      const whatsappUrl = `https://wa.me/${phone}?text=${encodedText}`;

      // Google Sites sandbox iframe requiere target _blank o abrir ventana nueva
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
